# CI — build, lint, test on every push/PR. The full release gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust tests (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: cargo build --release
      - name: Clippy (zero warnings)
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Rustfmt check
        run: cargo fmt --all -- --check
      - name: Test suite (release)
        run: cargo test --release
      - name: Test suite with overflow checks (release-checked)
        run: cargo test --profile release-checked

  wasm:
    name: WebAssembly + web verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build wasm
        run: ./scripts/build-wasm.sh
      - name: Web engine E2E (Node)
        run: node scripts/test-web.mjs
      - name: Web test suite (Node — same suite as the browser)
        run: node scripts/test-suite.mjs
      - name: Documentation examples (Node — every runnable example executes)
        run: node scripts/test-docs.mjs

  redteam:
    name: Red-team adversarial gates (out-of-tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The redteam target dir is outside the workspace cache key.
          workspaces: |
            .
            redteam
      - name: Run the red-team attack suite
        run: cargo test --release --manifest-path redteam/Cargo.toml
